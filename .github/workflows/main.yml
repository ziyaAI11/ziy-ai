name: Build Ziy AI APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip Android project
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -q ZiyAI_Android_with_new_icon.zip -d android-project

          SETTINGS_FILE=$(find android-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Replace MainActivity
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          MAIN_ACTIVITY=$(find app/src/main/java -type f -name "MainActivity.java" | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi

          cat > "$MAIN_ACTIVITY" <<'JAVA'
package com.ziy.ai;

import android.app.Activity;
import android.os.Bundle;
import android.graphics.Color;
import android.graphics.Typeface;
import android.view.Gravity;
import android.view.View;
import android.widget.Button;
import android.widget.EditText;
import android.widget.LinearLayout;
import android.widget.ScrollView;
import android.widget.TextView;

import org.json.JSONObject;

import java.io.BufferedReader;
import java.io.InputStream;
import java.io.InputStreamReader;
import java.io.OutputStream;
import java.net.HttpURLConnection;
import java.net.URL;
import java.nio.charset.StandardCharsets;

public class MainActivity extends Activity {

    private static final String SERVER_URL =
            "https://ziy-ai.onrender.com/api/chat";

    private LinearLayout messages;
    private EditText input;
    private Button sendButton;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        LinearLayout root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setBackgroundColor(Color.rgb(15,17,24));
        root.setPadding(24,20,24,12);

        TextView title = new TextView(this);
        title.setText("🤖  Ziy AI");
        title.setTextColor(Color.WHITE);
        title.setTextSize(28);
        title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
        root.addView(title, new LinearLayout.LayoutParams(-1,64));

        TextView hello = new TextView(this);
        hello.setText("سلام ضیا! 👋 من Ziy AI هستم. آماده‌ام! 🤖🔥");
        hello.setTextColor(Color.WHITE);
        hello.setTextSize(19);
        hello.setGravity(Gravity.RIGHT);
        hello.setPadding(0,20,0,20);
        root.addView(hello, new LinearLayout.LayoutParams(-1,-2));

        ScrollView scroll = new ScrollView(this);

        messages = new LinearLayout(this);
        messages.setOrientation(LinearLayout.VERTICAL);
        messages.setPadding(0,10,0,10);

        scroll.addView(messages);

        root.addView(
                scroll,
                new LinearLayout.LayoutParams(-1,0,1)
        );

        LinearLayout bottom = new LinearLayout(this);
        bottom.setOrientation(LinearLayout.HORIZONTAL);

        input = new EditText(this);
        input.setHint("پیامت رو بنوی...");
        input.setHintTextColor(Color.GRAY);
        input.setTextColor(Color.WHITE);
        input.setTextSize(18);

        bottom.addView(
                input,
                new LinearLayout.LayoutParams(0,58,1)
        );

        sendButton = new Button(this);
        sendButton.setText("ارسال");

        bottom.addView(
                sendButton,
                new LinearLayout.LayoutParams(125,58)
        );

        root.addView(bottom);

        setContentView(root);

        sendButton.setOnClickListener(v -> sendMessage(scroll));
    }

    private void addMessage(String text, boolean user) {

        TextView view = new TextView(this);

        view.setText(
                (user ? "شما: " : "Ziy AI: ") + text
        );

        view.setTextColor(Color.WHITE);
        view.setTextSize(18);
        view.setGravity(Gravity.RIGHT);
        view.setPadding(12,12,12,12);

        messages.addView(view);
    }

    private void sendMessage(ScrollView scroll) {

        String message =
                input.getText().toString().trim();

        if (message.isEmpty()) return;

        input.setText("");

        addMessage(message,true);
        addMessage("در حال فکر کردن... ⏳",false);

        sendButton.setEnabled(false);

        new Thread(() -> {

            String answer;

            try {
                answer = askServer(message);
            } catch (Exception e) {
                answer = "اتصال به سرور انجام نشد.";
            }

            final String result = answer;

            runOnUiThread(() -> {

                if (messages.getChildCount() > 0) {
                    messages.removeViewAt(
                            messages.getChildCount() - 1
                    );
                }

                addMessage(result,false);

                sendButton.setEnabled(true);

                scroll.post(() ->
                        scroll.fullScroll(View.FOCUS_DOWN)
                );
            });

        }).start();
    }

    private String askServer(String message)
            throws Exception {

        URL url = new URL(SERVER_URL);

        HttpURLConnection connection =
                (HttpURLConnection) url.openConnection();

        connection.setRequestMethod("POST");
        connection.setConnectTimeout(30000);
        connection.setReadTimeout(60000);
        connection.setDoOutput(true);

        connection.setRequestProperty(
                "Content-Type",
                "application/json; charset=UTF-8"
        );

        connection.setRequestProperty(
                "Accept",
                "application/json"
        );

        JSONObject body = new JSONObject();
        body.put("message",message);

        try (OutputStream os =
                     connection.getOutputStream()) {

            os.write(
                    body.toString()
                            .getBytes(StandardCharsets.UTF_8)
            );
        }

        int code = connection.getResponseCode();

        InputStream stream =
                code >= 200 && code < 300
                        ? connection.getInputStream()
                        : connection.getErrorStream();

        if (stream == null)
            throw new Exception("HTTP " + code);

        StringBuilder result =
                new StringBuilder();

        try (BufferedReader reader =
                     new BufferedReader(
                             new InputStreamReader(
                                     stream,
                                     StandardCharsets.UTF_8
                             )
                     )) {

            String line;

            while ((line = reader.readLine()) != null) {
                result.append(line);
            }
        }

        if (code < 200 || code >= 300)
            throw new Exception("HTTP " + code);

        JSONObject json =
                new JSONObject(result.toString());

        return json.optString(
                "text",
                "سرور پاسخی برنگرداند."
        );
    }
}
JAVA

          echo "MainActivity replaced successfully."

      - name: Add Internet permission
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ziy-AI-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error