name: Build Ziy AI APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: |
          mkdir android-project
          unzip -q ZiyAI_Android_with_new_icon.zip -d android-project

      - name: Find project
        run: |
          find android-project -name settings.gradle -o -name settings.gradle.kts

      - name: Build
        run: |
          cd android-project
          gradle assembleDebug --no-daemon